<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Term 1 Final Review Challenge</title><style>body{margin:0;background:#fff8ef;font-family:Arial,sans-serif;color:#44283a}main{max-width:850px;margin:25px auto;background:white;border:3px solid #8e3d58;border-radius:20px;padding:25px;box-shadow:0 10px 30px #e8d2d6}h1,h2{color:#7a294b}.pill{background:#ffe5a6;padding:8px 14px;border-radius:20px;display:inline-block}button{font-size:19px;border:2px solid #e0c3ce;border-radius:14px;padding:15px;background:#fff6f9;cursor:pointer;text-align:left}button:hover{background:#fce2ed}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.correct{background:#bde8c9!important}.wrong{background:#ffd0cd!important}.bar{height:12px;background:#f0dce5;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#8e3d58}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.controls button{font-size:16px;background:#f4e5b8}#feedback{font-weight:bold;min-height:28px;margin-top:15px}@media(max-width:650px){.answers{grid-template-columns:1fr}main{margin:8px;padding:16px}}</style></head><body><main><h1>ELA 2 · Final Review Challenge</h1><p>20 questions · Four rounds · One answer each. Read aloud and replay are available.</p><div class="bar"><div id="progress" style="width:0%"></div></div><p><span class="pill" id="round"></span> <span id="count"></span> <strong id="score" style="float:right"></strong></p><h2 id="question"></h2><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><div class="controls"><button onclick="speak()">🔊 Read question</button><button id="next" onclick="advance()" disabled>Next →</button><button onclick="restart()">↻ Play again</button></div></main><script>const items=[{"round": "Reading Detectives", "q": "Read: The School Show. Nina can sing, and Omar can play the drum. They practise together for the school show. Nina is nervous before the show. Omar smiles and says, “We can do it!” They perform well.\n\nWhat is Nina’s talent?", "options": ["Running", "Painting", "Swimming", "Singing"], "answer": "D"}, {"round": "Reading Detectives", "q": "Read: The School Show. Nina can sing, and Omar can play the drum. They practise together for the school show. Nina is nervous before the show. Omar smiles and says, “We can do it!” They perform well.\n\nWhat can Omar do?", "options": ["Ride a horse", "Cook dinner", "Climb trees", "Play the drum"], "answer": "D"}, {"round": "Reading Detectives", "q": "Read: The School Show. Nina can sing, and Omar can play the drum. They practise together for the school show. Nina is nervous before the show. Omar smiles and says, “We can do it!” They perform well.\n\nHow does Nina feel before the show?", "options": ["Sleepy", "Bored", "Nervous", "Angry"], "answer": "C"}, {"round": "Reading Detectives", "q": "Read: The School Show. Nina can sing, and Omar can play the drum. They practise together for the school show. Nina is nervous before the show. Omar smiles and says, “We can do it!” They perform well.\n\nHow does Omar help Nina?", "options": ["He laughs at her", "He encourages her", "He takes her drum", "He leaves early"], "answer": "B"}, {"round": "Reading Detectives", "q": "Read: The School Show. Nina can sing, and Omar can play the drum. They practise together for the school show. Nina is nervous before the show. Omar smiles and says, “We can do it!” They perform well.\n\nHow are Nina and Omar alike?", "options": ["Both sing", "Both practise for the show", "Both feel angry", "Both play the drum"], "answer": "B"}, {"round": "Word Explorers", "q": "What is a talent?", "options": ["A kind of food", "Something you do well", "A place to sleep", "A type of weather"], "answer": "B"}, {"round": "Word Explorers", "q": "Which word is an action?", "options": ["dance", "quiet", "purple", "small"], "answer": "A"}, {"round": "Word Explorers", "q": "What does brave mean?", "options": ["Feeling hungry", "Not giving up because of fear", "Moving slowly", "Being very small"], "answer": "B"}, {"round": "Word Explorers", "q": "Which word means to look after someone?", "options": ["break", "care", "jump", "drop"], "answer": "B"}, {"round": "Word Explorers", "q": "What does different mean?", "options": ["Not the same", "Exactly alike", "Very fast", "Very quiet"], "answer": "A"}, {"round": "Grammar Champions", "q": "Which sentence is a command?", "options": ["Where is the door?", "What a heavy door!", "Please close the door.", "The door is red."], "answer": "C"}, {"round": "Grammar Champions", "q": "Which sentence is a statement?", "options": ["The frog jumps.", "Jump now!", "Does the frog jump?", "What a fast frog!"], "answer": "A"}, {"round": "Grammar Champions", "q": "Which sentence is written correctly?", "options": ["Lily lives in Hanoi.", "lily lives in Hanoi.", "lily lives in hanoi.", "Lily lives in hanoi."], "answer": "A"}, {"round": "Grammar Champions", "q": "Which pronoun replaces “Tom”?", "options": ["we", "they", "he", "she"], "answer": "C"}, {"round": "Grammar Champions", "q": "What is the plural of baby?", "options": ["babies", "baby’s", "babyes", "babys"], "answer": "A"}, {"round": "Writing Experts", "q": "What should you do before writing a story?", "options": ["Forget the topic", "Plan your ideas", "Skip the beginning", "Erase your title"], "answer": "B"}, {"round": "Writing Experts", "q": "Which word tells the first event?", "options": ["First", "Afterward", "Finally", "Last"], "answer": "A"}, {"round": "Writing Experts", "q": "Which word tells the last event?", "options": ["First", "Finally", "Earlier", "Before"], "answer": "B"}, {"round": "Writing Experts", "q": "Which sentence tells a feeling?", "options": ["The dog ran.", "I felt proud.", "I walked home.", "The bus stopped."], "answer": "B"}, {"round": "Writing Experts", "q": "What do you check when editing?", "options": ["Only the page number", "Only the paper color", "Only the drawing", "Capital letters and punctuation"], "answer": "D"}];let i=0,score=0,chosen=false;function render(){if(i>=items.length){document.getElementById('round').textContent='All done!';document.getElementById('count').textContent='';document.getElementById('question').textContent='You scored '+score+' out of '+items.length+'!';document.getElementById('answers').innerHTML='';document.getElementById('feedback').textContent='Great work! Replay to practise again.';document.getElementById('next').disabled=true;document.getElementById('progress').style.width='100%';return}let x=items[i];chosen=false;document.getElementById('round').textContent=x.round;document.getElementById('count').textContent='Question '+(i+1)+' / '+items.length;document.getElementById('score').textContent='Score: '+score;document.getElementById('question').textContent=x.q;document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('progress').style.width=(i/items.length*100)+'%';let el=document.getElementById('answers');el.innerHTML='';x.options.forEach((o,j)=>{let b=document.createElement('button');b.textContent='ABCD'[j]+'. '+o;b.onclick=()=>{if(chosen)return;chosen=true;let ok='ABCD'[j]===x.answer;if(ok)score++;document.getElementById('score').textContent='Score: '+score;document.getElementById('feedback').textContent=ok?'Correct! Well done.':'Try to remember: '+x.options['ABCD'.indexOf(x.answer)];[...el.children].forEach((z,k)=>{z.disabled=true;if('ABCD'[k]===x.answer)z.classList.add('correct');else if(k===j)z.classList.add('wrong')});document.getElementById('next').disabled=false};el.appendChild(b)})}function advance(){i++;render()}function restart(){i=0;score=0;render()}function speak(){if(!('speechSynthesis' in window)){alert('Read-aloud is not supported in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(items[i]?.q||'Great work!');u.rate=.83;speechSynthesis.speak(u)}render();</script></body></html>
